spring.application.name=ProductService

server.port=8081
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/productDB
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG




spring.kafka.consumer.bootstrap-servers=localhost:9092

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.group-id=product-service

spring.kafka.consumer.properties[spring.json.trusted.packages]=com.app.core.entity.event

#consume
app.kafka.topic.order-created=order-created
app.kafka.topic.product-release-request = product-release-request

#produce
app.kafka.topic.product-reservation-result = product-reservation-result
app.kafka.topic.product-release-result= product-release-result



