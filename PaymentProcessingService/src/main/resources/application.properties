spring.application.name=PaymentProcessingService


server.port=8083



spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/paymentDB
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG


spring.kafka.producer.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.app.core.entity.event

#consume
app.kafka.topic.payment-request=payment-requested

#producer
app.kafka.topic.payment-result=payment-result
app.kafka.topic.order-cancel=order-cancel








